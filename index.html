```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Поддержать Іляса</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .card {
            width: 90%;
            max-width: 420px;
            padding: 35px 25px;
            text-align: center;
            background: #1c1c1c;
            border-radius: 25px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
        }

        .heart {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            color: #aaa;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .donate-button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 15px;
            background: white;
            color: #111;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .donate-button:hover {
            transform: scale(1.03);
        }

        .number-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #292929;
            border-radius: 18px;
        }

        .kaspi-title {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 8px;
        }

        .owner {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .number {
            font-size: 21px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 18px;
        }

        .copy {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 13px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .thanks {
            margin-top: 18px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="heart">❤️</div>

    <h1>Поддержать меня</h1>

    <p>
        Если тебе нравится мой контент,
        ты можешь поддержать меня небольшим донатом.
    </p>

    <button class="donate-button" onclick="showNumber()">
        💙 Пожертвовать
    </button>

    <div class="number-box" id="donateBox">

        <div class="kaspi-title">
            Kaspi номер
        </div>

        <div class="owner">
            Іляс Н
        </div>

        <!-- ЗАМЕНИ ЭТОТ НОМЕР НА СВОЙ -->
        <div class="number" id="kaspiNumber">
            0000 0000 0000 0000
        </div>

        <button class="copy" onclick="copyNumber()">
            📋 Скопировать номер
        </button>

        <div class="thanks">
            Спасибо за поддержку ❤️
        </div>

    </div>

</div>

<script>

function showNumber() {
    document.getElementById("donateBox").style.display = "block";
}

function copyNumber() {

    const number = document.getElementById("kaspiNumber").innerText;

    navigator.clipboard.writeText(number);

    alert("Номер Kaspi скопирован ❤️");
}

</script>

</body>
</html>
```
